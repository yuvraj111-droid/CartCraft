<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CartCraft | Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/pages/checkout/checkout-header.css">
    <link rel="stylesheet" href="styles/pages/checkout/checkout.css">
  </head>
  <body>
    <header class="checkout-header">
      <div class="header-content">
        <div class="checkout-header-left-section">
          <a href="index.html" class="cartcraft-name checkout-brand">Cart<span>Craft</span></a>
        </div>
        <div class="checkout-header-middle-section">
          Checkout (<a class="return-to-home-link" href="index.html"><span class="js-checkout-item-count">0</span> items</a>)
        </div>
        <div class="checkout-header-right-section">
          <a class="back-to-shop-link" href="index.html">Continue shopping</a>
        </div>
      </div>
    </header>

    <main class="main">
      <h1 class="page-title">Review your order</h1>
      <div class="checkout-grid">
        <section class="order-summary js-order-summary" aria-label="Cart items"></section>
        <aside class="payment-summary js-payment-summary" aria-label="Order summary"></aside>
      </div>
    </main>

    <script src="scripts/checkout.js" type="module"></script>
  </body>
</html>
