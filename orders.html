<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CartCraft | Your Orders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/shared/site-header.css">
    <link rel="stylesheet" href="styles/pages/orders.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-left-section">
        <a href="index.html" class="header-link cartcraft-logo" aria-label="CartCraft home">
          <span class="cartcraft-name">Cart<span>Craft</span></span>
        </a>
      </div>
      <div class="orders-header-title">Your orders</div>
      <nav class="header-right-section" aria-label="Main navigation">
        <a class="orders-link header-link" href="index.html">Continue shopping</a>
        <a class="cart-link header-link" href="checkout.html">
          <img class="cart-icon" src="images/icons/cart-icon.png" alt="">
          <span class="cart-text">Cart</span>
        </a>
      </nav>
    </header>

    <main class="main">
      <h1 class="page-title">Your Orders</h1>
      <div class="orders-grid js-orders-grid" aria-live="polite"></div>
    </main>

    <script src="scripts/orders.js" type="module"></script>
  </body>
</html>
