<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CartCraft | Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/shared/site-header.css">
    <link rel="stylesheet" href="styles/pages/store.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-left-section">
        <a href="index.html" class="header-link cartcraft-logo" aria-label="CartCraft home">
          <span class="cartcraft-name">Cart<span>Craft</span></span>
        </a>
      </div>

      <form class="header-middle-section js-search-form" role="search">
        <input
          class="search-bar js-search-input"
          type="search"
          placeholder="Search products"
          aria-label="Search products">
        <button class="search-button" type="submit" aria-label="Search">
          <img class="search-icon" src="images/icons/search-icon.png" alt="">
        </button>
      </form>

      <nav class="header-right-section" aria-label="Main navigation">
        <a class="orders-link header-link" href="orders.html">
          <span class="returns-text">Your</span>
          <span class="orders-text">Orders</span>
        </a>
        <a class="cart-link header-link" href="checkout.html">
          <img class="cart-icon" src="images/icons/cart-icon.png" alt="">
          <span class="cart-quantity js-cart-quantity">0</span>
          <span class="cart-text">Cart</span>
        </a>
      </nav>
    </header>

    <main class="main">
      <div class="store-toolbar">
        <p class="search-results-message js-search-message" role="status" aria-live="polite">
          Loading products...
        </p>
        <label class="sort-control">
          Sort by
          <select class="js-sort-select">
            <option value="recommended">Recommended</option>
            <option value="price-low">Price: low to high</option>
            <option value="price-high">Price: high to low</option>
            <option value="name">Name: A to Z</option>
          </select>
        </label>
      </div>
      <div class="products-grid js-product-grid"></div>
    </main>

    <script src="scripts/store.js" type="module"></script>
  </body>
</html>
